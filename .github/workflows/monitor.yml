name: Monitor prezzi (ogni ora)

on:
  schedule:
    # GitHub ritarda e a volte salta i cron (dal 21 al 27/11 sono partiti 17 giri su 56 previsti).
    # Due orari per ora a minuti "dispari": se uno salta, parte l'altro. I dati della stessa ora si sovrascrivono.
    - cron: "7 * * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      sites:
        description: "Siti da controllare (separati da virgola)"
        default: "amazon,backmarket,trendevice,swappie,refurbed"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  # Fine monitoraggio: dopo FINE (ora italiana) avvisa su Telegram, disattiva questo workflow e non controlla più.
  gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        env:
          FINE: "2026-12-01"
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          oggi=$(TZ=Europe/Rome date +%F)
          if [[ "$oggi" > "$FINE" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Monitoraggio terminato il $FINE: disattivo il workflow."
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=🏁 Monitoraggio prezzi iPhone terminato (fine prevista: 1 dicembre). Il controllo automatico è stato disattivato; per riattivarlo: Actions → Monitor prezzi → Enable workflow."
            fi
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/disable" || true
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    # Server GitHub. Con la variabile MONITOR_RUNNER = self-hosted gira invece il job "run-local" sul PC di casa.
    if: needs.gate.outputs.active == 'true' && vars.MONITOR_RUNNER != 'self-hosted'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Etichetta "offerta"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh label create offerta --color 1a8a4a --description "Offerta sotto soglia" 2>/dev/null || true
      - name: Controllo siti
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_SCREENSHOTS: "1"
        run: python -m monitor.run --sites "${{ github.event.inputs.sites || 'amazon,backmarket,trendevice,swappie,refurbed' }}"
      - name: Screenshot diagnostica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
      - name: Report
        run: python -m monitor.analyze >> "$GITHUB_STEP_SUMMARY" || true
      - name: Salva dati
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet && exit 0
          git commit -m "dati $(date -u +%Y-%m-%dT%H:00Z)"
          for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done

  # PC di casa (Windows, self-hosted): IP domestico, così Amazon, Back Market e Swappie non bloccano.
  # Passi in PowerShell: il servizio del runner non vede Bash. Serve Python 3 installato sul PC.
  run-local:
    needs: gate
    if: needs.gate.outputs.active == 'true' && vars.MONITOR_RUNNER == 'self-hosted'
    runs-on: self-hosted
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Python del PC
        run: |
          $ErrorActionPreference = 'Stop'
          $py = $null
          if (Get-Command py -ErrorAction SilentlyContinue) { $py = 'py' ; $pyargs = @('-3') }
          elseif (Get-Command python -ErrorAction SilentlyContinue) { $py = 'python' ; $pyargs = @() }
          if (-not $py) {
            Write-Output "::error::Python non trovato sul PC: installa Python 3.12 da python.org (opzioni 'Install for all users' e 'Add python.exe to PATH'), poi riavvia il servizio del runner."
            exit 1
          }
          & $py @pyargs --version
          if (-not (Test-Path .venv)) { & $py @pyargs -m venv .venv }
          Add-Content -Path $env:GITHUB_PATH -Value "$PWD\.venv\Scripts"
      - name: Dipendenze
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install chromium
      - name: Controllo siti
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_SCREENSHOTS: "1"
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: python -m monitor.run --sites "${{ github.event.inputs.sites || 'amazon,backmarket,trendevice,swappie,refurbed' }}"
      - name: Screenshot diagnostica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
      - name: Report
        env: { PYTHONUTF8: "1" }
        run: python -m monitor.analyze | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - name: Salva dati
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "dati $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:00Z')) (PC)"
          for ($i = 1; $i -le 3; $i++) {
            git pull --rebase -X ours
            git push
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 5
          }

  # I push fatti con GITHUB_TOKEN non avviano altri workflow: la dashboard si pubblica qui.
  pages:
    needs: [run, run-local]
    if: always() && (needs.run.result == 'success' || needs['run-local'].result == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      # Un errore temporaneo di GitHub Pages non deve segnare il giro come fallito (e mandarti una mail):
      # i dati sono già salvati, la dashboard si aggiorna al giro successivo.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
