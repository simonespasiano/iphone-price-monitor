name: Monitor prezzi (ogni 3 ore)

on:
  schedule:
    - cron: "30 2-23/3 * * *"  # ogni 3 ore al minuto 30 (UTC): in Italia 15:30, 18:30, 21:30, 00:30, 03:30, 06:30, 09:30, 12:30 (ora legale: +1)
  workflow_dispatch:
    inputs:
      sites:
        description: "Siti da controllare (separati da virgola)"
        default: "amazon,backmarket,trendevice"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  # Fine monitoraggio: dopo FINE (ora italiana) avvisa su Telegram, disattiva questo workflow e non controlla più.
  gate:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.check.outputs.active }}
    steps:
      - id: check
        env:
          FINE: "2026-12-01"
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          oggi=$(TZ=Europe/Rome date +%F)
          if [[ "$oggi" > "$FINE" ]]; then
            echo "active=false" >> "$GITHUB_OUTPUT"
            echo "Monitoraggio terminato il $FINE: disattivo il workflow."
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
              curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=🏁 Monitoraggio prezzi iPhone terminato (fine prevista: 1 dicembre). Il controllo automatico è stato disattivato; per riattivarlo: Actions → Monitor prezzi → Enable workflow."
            fi
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/disable" || true
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi

  run:
    needs: gate
    if: needs.gate.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dipendenze
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Etichetta "offerta"
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh label create offerta --color 1a8a4a --description "Offerta sotto soglia" 2>/dev/null || true
      - name: Controllo siti
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEBUG_SCREENSHOTS: "1"
        run: python -m monitor.run --sites "${{ github.event.inputs.sites || 'amazon,backmarket,trendevice' }}"
      - name: Screenshot diagnostica
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3
      - name: Report
        run: python -m monitor.analyze >> "$GITHUB_STEP_SUMMARY" || true
      - name: Salva dati
        run: |
          git config user.name "price-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet && exit 0
          git commit -m "dati $(date -u +%Y-%m-%dT%H:00Z)"
          for i in 1 2 3; do git pull --rebase -X ours && git push && break; sleep 5; done

  # I push fatti con GITHUB_TOKEN non avviano altri workflow: la dashboard si pubblica qui.
  pages:
    needs: run
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@v4
